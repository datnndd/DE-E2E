x-airflow-common: &airflow-common
  image: de-e2e-airflow:3.2.2
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_LANDING_PREFIX: ${S3_LANDING_PREFIX:-lakehouse/landing/douyin/api_raw/json}
    S3_MEDIA_PREFIX: ${S3_MEDIA_PREFIX:-lakehouse/landing/douyin/media_raw}
    S3_MEDIA_MANIFEST_PREFIX: ${S3_MEDIA_MANIFEST_PREFIX:-lakehouse/landing/douyin/media_manifest/json}
    DOUYIN_DOWNLOAD_MEDIA: ${DOUYIN_DOWNLOAD_MEDIA:-true}
    DOUYIN_SEED_FILE: ${AIRFLOW_DOUYIN_SEED_FILE:-/opt/airflow/seeds/douyin_food_restaurant_seeds.yml}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./seeds:/opt/airflow/seeds:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
  networks:
    - orchestration

services:
  airflow-postgres:
    image: postgres:15-alpine
    container_name: de-e2e-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - orchestration

  airflow-init:
    profiles: ["init"]
    <<: *airflow-common
    container_name: de-e2e-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        airflow db migrate
    environment:
      <<: *airflow-common-env
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: de-e2e-airflow-api-server
    command: api-server
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: de-e2e-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: de-e2e-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
  ingestion-worker:
    build:
      context: ./ingestion-worker
      dockerfile: Dockerfile
    container_name: de-e2e-ingestion-worker
    environment:
      DOUYIN_LINK: ${DOUYIN_LINK:-}
      DOUYIN_MSTOKEN: ${DOUYIN_MSTOKEN:-}
      DOUYIN_TTWID: ${DOUYIN_TTWID:-}
      DOUYIN_ODIN_TT: ${DOUYIN_ODIN_TT:-}
      DOUYIN_PASSPORT_CSRF_TOKEN: ${DOUYIN_PASSPORT_CSRF_TOKEN:-}
      DOUYIN_SID_GUARD: ${DOUYIN_SID_GUARD:-}
      DOUYIN_SESSIONID: ${DOUYIN_SESSIONID:-}
      DOUYIN_SID_TT: ${DOUYIN_SID_TT:-}
      DOUYIN_MODE: ${DOUYIN_MODE:-post}
      DOUYIN_LIMIT: ${DOUYIN_LIMIT:-20}
      DOUYIN_START_TIME: ${DOUYIN_START_TIME:-}
      DOUYIN_END_TIME: ${DOUYIN_END_TIME:-}
      DOUYIN_SEED_FILE: ${DOUYIN_SEED_FILE:-/app/seeds/douyin_food_restaurant_seeds.yml}
    volumes:
      - ./seeds:/app/seeds:ro
    ports:
      - "${INGESTION_WORKER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - orchestration

networks:
  orchestration:
    name: de-e2e-orchestration

volumes:
  airflow-postgres-data:
    name: de-e2e-airflow-postgres-data
